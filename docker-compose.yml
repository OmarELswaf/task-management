include:
  - ./supabase/docker/docker-compose.yml

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: http://localhost:8000
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}

    ports:
      - "5173:80"

    depends_on:
      kong:
        condition: service_healthy